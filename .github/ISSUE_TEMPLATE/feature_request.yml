name: Feature proposal
description: Discuss a focused improvement before implementation.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who encounters this problem and what are they trying to do? Use synthetic examples; omit private page data.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the outcome, alternatives and scope limits. New modules can use the module proposal template.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation and implications
      description: How could we verify this? Note any permission, privacy, dependency or accessibility implications.
